<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — Fidget3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 2rem; border-bottom: 1px solid #1e1e1e; }
    nav .logo { font-size: 1.3rem; font-weight: 800; letter-spacing: 2px; text-decoration: none; color: #fff; }
    nav .logo span { color: #a78bfa; }
    nav a { color: #aaa; text-decoration: none; margin-left: 1.5rem; font-size: 0.95rem; }
    nav a:hover { color: #fff; }
    .page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; background: radial-gradient(ellipse at top, #1a0a2e 0%, #0f0f0f 60%); }
    .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 420px; }
    .card h1 { font-size: 1.6rem; margin-bottom: 0.4rem; }
    .card .sub { color: #666; font-size: 0.9rem; margin-bottom: 2rem; }
    .notice { border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.9rem; margin-bottom: 1.2rem; }
    .notice.error { background: #2a1a1a; border: 1px solid #4a2a2a; color: #f87171; }
    .notice.info { background: #1a1e2e; border: 1px solid #2a3a5a; color: #a78bfa; }
    label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 0.4rem; }
    input { width: 100%; padding: 0.75rem 1rem; margin-bottom: 1.2rem; background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 8px; color: #fff; font-size: 1rem; font-family: inherit; transition: border-color 0.2s; }
    input:focus { outline: none; border-color: #a78bfa; }
    .btn { width: 100%; padding: 0.8rem; background: #a78bfa; color: #000; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-bottom: 1rem; transition: background 0.2s; }
    .btn:hover { background: #c4b5fd; }
    .divider { display: flex; align-items: center; gap: 0.75rem; color: #444; font-size: 0.85rem; margin-bottom: 1rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #2a2a2a; }
    .google-btn { width: 100%; padding: 0.8rem; background: transparent; color: #fff; border: 1px solid #2a2a2a; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-bottom: 1.5rem; transition: border-color 0.2s, background 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.6rem; font-family: inherit; }
    .google-btn:hover { border-color: #a78bfa; background: #1e1e1e; }
    .footer-link { text-align: center; color: #666; font-size: 0.9rem; }
    .footer-link a { color: #a78bfa; text-decoration: none; font-weight: 600; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo">Fidget<span>3D</span></a>
    <div>
      <a href="/#products">Shop</a>
      <a href="/reviews">Reviews</a>
      <a href="/contact">Contact</a>
    </div>
  </nav>
  <div class="page">
    <div class="card">
      <h1>Welcome back</h1>
      <p class="sub">Log in to your Fidget3D account</p>
      <div id="notice" style="display:none" class="notice"></div>
      <form action="/auth/login" method="POST">
        <label>Email address</label>
        <input type="email" name="email" placeholder="you@example.com" required autofocus />
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required />
        <button type="submit" class="btn">Log in</button>
      </form>
      <div class="divider">or</div>
      <a href="/auth/google" style="text-decoration:none;">
        <button class="google-btn">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
          Continue with Google
        </button>
      </a>
      <p class="footer-link">Don't have an account? <a href="/register">Sign up</a></p>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const notice = document.getElementById('notice');
    if (params.get('error')) {
      notice.textContent = 'Incorrect email or password. Please try again.';
      notice.className = 'notice error';
      notice.style.display = 'block';
    } else if (params.get('next') === 'cart') {
      notice.textContent = '👋 Log in to add items to your cart.';
      notice.className = 'notice info';
      notice.style.display = 'block';
    }
  </script>
</body>
</html>
