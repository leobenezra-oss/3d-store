<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — Fidget3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; color: #111; min-height: 100vh; display: flex; flex-direction: column; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; border-bottom: 1px solid #e0e0e0; background: #fff; }
    nav .logo img { height: 48px; width: auto; display: block; }
    nav a { color: #555; text-decoration: none; margin-left: 1.5rem; font-size: 0.95rem; }
    nav a:hover { color: #111; }
    .page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .card h1 { font-size: 1.6rem; margin-bottom: 0.4rem; }
    .card .sub { color: #888; font-size: 0.9rem; margin-bottom: 2rem; }
    .notice { border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.9rem; margin-bottom: 1.2rem; }
    .notice.error { background: #fff0f0; border: 1px solid #fca5a5; color: #dc2626; }
    .notice.info { background: #f0f0ff; border: 1px solid #a78bfa; color: #6d28d9; }
    label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 0.4rem; }
    input { width: 100%; padding: 0.75rem 1rem; margin-bottom: 1.2rem; background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; color: #111; font-size: 1rem; font-family: inherit; transition: border-color 0.2s; }
    input:focus { outline: none; border-color: #a78bfa; background: #fff; }
    .btn { width: 100%; padding: 0.8rem; background: #a78bfa; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-bottom: 1rem; transition: background 0.2s; }
    .btn:hover { background: #7c3aed; }
    .divider { display: flex; align-items: center; gap: 0.75rem; color: #bbb; font-size: 0.85rem; margin-bottom: 1rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e0e0e0; }
    .google-btn { width: 100%; padding: 0.8rem; background: #fff; color: #111; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: center; gap: 0.6rem; font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s; }
    .google-btn:hover { border-color: #a78bfa; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .footer-link { text-align: center; color: #888; font-size: 0.9rem; }
    .footer-link a { color: #a78bfa; text-decoration: none; font-weight: 600; }
    .footer-link a:hover { text-decoration: underline; }
    .spinner { display: none; width: 18px; height: 18px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <nav>
    <a href="/"><img src="/SmallLogo-removebg-preview.png" alt="Fidget3D"></a>
    <div>
      <a href="/#products">Shop</a>
      <a href="/reviews">Reviews</a>
      <a href="/contact">Contact</a>
    </div>
  </nav>
  <div class="page">
    <div class="card">
      <h1>Welcome back</h1>
      <p class="sub">Log in to your Fidget3D account</p>
      <div id="notice" style="display:none" class="notice"></div>

      <label>Email address</label>
      <input type="email" id="email" placeholder="you@example.com" />
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" />
      <button class="btn" onclick="emailLogin()">
        <span id="btn-text">Log in</span>
        <div class="spinner" id="spinner"></div>
      </button>

      <div class="divider">or</div>

      <button class="google-btn" onclick="googleLogin()">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
        Continue with Google
      </button>

      <p class="footer-link">Don't have an account? <a href="/register">Sign up</a></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyCm5B5JqR7dee8y8DbLAU_5xRgsZCjpGFs",
      authDomain: "fidget3d-5f9e4.firebaseapp.com",
      projectId: "fidget3d-5f9e4",
      storageBucket: "fidget3d-5f9e4.firebasestorage.app",
      messagingSenderId: "950659286370",
      appId: "1:950659286370:web:295446d048630d9483583b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const params = new URLSearchParams(window.location.search);
    const notice = document.getElementById('notice');
    if (params.get('next') === 'cart') {
      notice.textContent = '👋 Log in to add items to your cart.';
      notice.className = 'notice info';
      notice.style.display = 'block';
    }

    // FIXED: Create server session after login
    async function createServerSession(user) {
      const idToken = await user.getIdToken();
      const res = await fetch('/auth/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken })
      });
      if (!res.ok) throw new Error('Session creation failed');
    }

    function showError(msg) {
      notice.textContent = msg;
      notice.className = 'notice error';
      notice.style.display = 'block';
      document.getElementById('btn-text').style.display = 'inline';
      document.getElementById('spinner').style.display = 'none';
    }

    window.emailLogin = async function() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (!email || !password) return showError('Please fill in all fields.');
      document.getElementById('btn-text').style.display = 'none';
      document.getElementById('spinner').style.display = 'block';
      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        await createServerSession(cred.user);
        const redirectTo = params.get('next') || '/';
        window.location.href = redirectTo;
      } catch (err) {
        showError('Incorrect email or password.');
      }
    };

    window.googleLogin = async function() {
      try {
        const provider = new GoogleAuthProvider();
        const cred = await signInWithPopup(auth, provider);
        await createServerSession(cred.user);
        const redirectTo = params.get('next') || '/';
        window.location.href = redirectTo;
      } catch (err) {
        showError('Google sign-in failed. Please try again.');
      }
    };

    // Redirect if already logged in
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const redirectTo = params.get('next') || '/';
        window.location.href = redirectTo;
      }
    });
  </script>
</body>
</html>
