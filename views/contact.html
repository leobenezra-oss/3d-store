<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Fidget3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; }
    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.2rem 2rem; border-bottom: 1px solid #1e1e1e;
    }
    nav .logo { font-size: 1.3rem; font-weight: 800; letter-spacing: 2px; text-decoration: none; color: #fff; }
    nav .logo span { color: #a78bfa; }
    nav a { color: #aaa; text-decoration: none; margin-left: 1.5rem; font-size: 0.95rem; }
    nav a:hover { color: #fff; }
    .container {
      max-width: 600px; margin: 4rem auto; padding: 0 2rem;
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .subtitle { color: #888; margin-bottom: 2rem; }
    .success {
      background: #1a2e1a; border: 1px solid #2a4a2a; border-radius: 8px;
      padding: 1rem 1.2rem; margin-bottom: 1.5rem; color: #6fcf6f;
    }
    .error-msg {
      background: #2e1a1a; border: 1px solid #4a2a2a; border-radius: 8px;
      padding: 1rem 1.2rem; margin-bottom: 1.5rem; color: #cf6f6f;
    }
    .card {
      background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 12px; padding: 2rem;
    }
    label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: #aaa; }
    input, textarea {
      width: 100%; padding: 0.75rem 1rem; margin-bottom: 1.2rem;
      background: #0f0f0f; border: 1px solid #2a2a2a;
      border-radius: 8px; color: #fff; font-size: 1rem; font-family: inherit;
    }
    textarea { height: 140px; resize: vertical; }
    input:focus, textarea:focus { outline: none; border-color: #a78bfa; }
    button {
      width: 100%; padding: 0.8rem; background: #a78bfa; color: #000;
      border: none; border-radius: 8px; font-size: 1rem;
      font-weight: 700; cursor: pointer;
    }
    button:hover { background: #c4b5fd; }
    footer {
      text-align: center; padding: 2rem; color: #555;
      font-size: 0.85rem; border-top: 1px solid #1e1e1e; margin-top: 4rem;
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo">Fidget<span>3D</span></a>
    <div>
      <a href="/#products">Shop</a>
      <a href="/reviews">Reviews</a>
      <a href="/contact">Contact</a>
    </div>
  </nav>

  <div class="container">
    <h1>Get in touch</h1>
    <p class="subtitle">Questions about an order? Want a custom colour? We'd love to hear from you.</p>

    <div id="msg"></div>

    <div class="card">
      <form action="/contact" method="POST">
        <label>Your name</label>
        <input type="text" name="name" placeholder="Leo" required />
        <label>Your email</label>
        <input type="email" name="email" placeholder="you@example.com" required />
        <label>Message</label>
        <textarea name="message" placeholder="Hi, I'd like to ask about..." required></textarea>
        <button type="submit">Send message</button>
      </form>
    </div>
  </div>

  <footer>&copy; 2026 Fidget3D. All rights reserved.</footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const msg = document.getElementById('msg');
    if (params.get('sent') === 'true') {
      msg.innerHTML = '<div class="success">✅ Message sent! We\'ll get back to you soon.</div>';
    } else if (params.get('sent') === 'error') {
      msg.innerHTML = '<div class="error-msg">❌ Something went wrong. Please email us directly at AFidgets3D@gmail.com</div>';
    }
  </script>
</body>
</html>
