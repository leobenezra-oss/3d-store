<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews — Fidget3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #fff; color: #111; min-height: 100vh; }

    nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; border-bottom: 1px solid #e5e5e5; position: sticky; top: 0; background: #fff; z-index: 100; }
    nav .logo img { height: 48px; width: auto; display: block; }
    .nav-links a { color: #555; text-decoration: none; margin-left: 1.25rem; font-size: 0.95rem; }
    .nav-links a:hover { color: #111; }
    .nav-login { background: none; border: 1.5px solid #ddd; color: #111; padding: 0.45rem 1.1rem; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-family: inherit; font-weight: 600; transition: border-color 0.2s, color 0.2s; margin-left: 1rem; text-decoration: none; display: inline-block; }
    .nav-login:hover { border-color: #7c3aed; color: #7c3aed; }
    .nav-user { font-size: 0.85rem; color: #555; margin-left: 1rem; display: none; align-items: center; gap: 0.75rem; }
    .nav-user-email { font-weight: 600; color: #111; }
    .nav-logout { background: none; border: none; color: #7c3aed; cursor: pointer; font-size: 0.85rem; font-family: inherit; font-weight: 600; padding: 0; }
    .nav-logout:hover { text-decoration: underline; }

    .page-header { background: #faf8ff; border-bottom: 1px solid #ede9fe; padding: 3rem 2rem 2.5rem; text-align: center; }
    .page-header h1 { font-size: 2rem; color: #111; margin-bottom: 0.5rem; }
    .page-header p { color: #666; font-size: 1rem; }

    .container { max-width: 800px; margin: 3rem auto; padding: 0 2rem; }

    .success { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 1rem 1.2rem; margin-bottom: 1.5rem; color: #16a34a; }

    .form-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 2rem; margin-bottom: 3rem; box-shadow: 0 1px 8px rgba(0,0,0,0.04); }
    .form-card h2 { margin-bottom: 1.5rem; font-size: 1.15rem; font-weight: 700; color: #111; }
    label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: #555; font-weight: 600; }
    input, textarea, select { width: 100%; padding: 0.75rem 1rem; margin-bottom: 1.2rem; background: #f9f9f9; border: 1.5px solid #e5e5e5; border-radius: 8px; color: #111; font-size: 1rem; font-family: inherit; transition: border-color 0.2s; }
    textarea { height: 100px; resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #7c3aed; background: #fff; }
    button { width: 100%; padding: 0.8rem; background: #7c3aed; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #6d28d9; }

    .reviews-list h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 1.5rem; color: #111; }
    .review-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; box-shadow: 0 1px 6px rgba(0,0,0,0.03); }
    .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
    .review-name { font-weight: 700; color: #111; }
    .stars { color: #f59e0b; font-size: 1.1rem; }
    .review-text { color: #555; font-size: 0.9rem; line-height: 1.6; }
    .review-date { color: #aaa; font-size: 0.8rem; margin-top: 0.5rem; }
    .no-reviews { color: #bbb; text-align: center; padding: 2rem; }

    footer { text-align: center; padding: 2rem; color: #bbb; font-size: 0.85rem; border-top: 1px solid #f0f0f0; margin-top: 4rem; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo"><img src="/SmallLogo-removebg-preview.png" alt="Fidget3D"></a>
    <div style="display:flex;align-items:center;">
      <div class="nav-links">
        <a href="/#products">Shop</a>
        <a href="/reviews">Reviews</a>
        <a href="/contact">Contact</a>
      </div>
      <a href="/login" class="nav-login" id="nav-login-btn">Log in</a>
      <div class="nav-user" id="nav-user">
        <span class="nav-user-email" id="nav-email"></span>
        <button class="nav-logout" onclick="logout()">Log out</button>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <h1>Customer Reviews</h1>
    <p>See what our customers think — and leave your own review!</p>
  </div>

  <div class="container">
    <div id="msg"></div>
    <div class="form-card">
      <h2>Leave a review</h2>
      <form action="/reviews" method="POST">
        <label>Your name</label>
        <input type="text" name="name" placeholder="Leo" required />
        <label>Rating</label>
        <select name="rating" required>
          <option value="">Select a rating</option>
          <option value="5">⭐⭐⭐⭐⭐ — 5 stars</option>
          <option value="4">⭐⭐⭐⭐ — 4 stars</option>
          <option value="3">⭐⭐⭐ — 3 stars</option>
          <option value="2">⭐⭐ — 2 stars</option>
          <option value="1">⭐ — 1 star</option>
        </select>
        <label>Your review</label>
        <textarea name="message" placeholder="I loved the Octopus Fidget..." required></textarea>
        <button type="submit">Submit review</button>
      </form>
    </div>

    <div class="reviews-list">
      <h2>What people are saying</h2>
      <div id="reviews-container"><p class="no-reviews">Loading reviews...</p></div>
    </div>
  </div>

  <footer>&copy; 2026 Fidget3D. All rights reserved.</footer>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    const firebaseConfig = { apiKey: "AIzaSyCm5B5JqR7dee8y8DbLAU_5xRgsZCjpGFs", authDomain: "fidget3d-5f9e4.firebaseapp.com", projectId: "fidget3d-5f9e4", storageBucket: "fidget3d-5f9e4.firebasestorage.app", messagingSenderId: "950659286370", appId: "1:950659286370:web:295446d048630d9483583b" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    onAuthStateChanged(auth, (user) => {
      const loginBtn = document.getElementById('nav-login-btn');
      const userEl = document.getElementById('nav-user');
      const emailEl = document.getElementById('nav-email');
      if (user) { loginBtn.style.display = 'none'; userEl.style.display = 'flex'; emailEl.textContent = user.email; }
      else { loginBtn.style.display = 'inline-block'; userEl.style.display = 'none'; }
    });
    window.logout = async function() { await signOut(auth); await fetch('/auth/logout', { method: 'POST' }); window.location.href = '/'; };
  </script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const msg = document.getElementById('msg');
    if (params.get('submitted') === 'true') {
      msg.innerHTML = '<div class="success">⭐ Thanks for your review!</div>';
    }
    fetch('/reviews/data')
      .then(r => r.json())
      .then(reviews => {
        const container = document.getElementById('reviews-container');
        if (reviews.length === 0) {
          container.innerHTML = '<p class="no-reviews">No reviews yet — be the first!</p>';
          return;
        }
        container.innerHTML = reviews.map(r => `
          <div class="review-card">
            <div class="review-header">
              <span class="review-name">${r.name}</span>
              <span class="stars">${'⭐'.repeat(r.rating)}</span>
            </div>
            <p class="review-text">${r.message}</p>
            <p class="review-date">${new Date(r.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}</p>
          </div>
        `).join('');
      })
      .catch(() => {
        document.getElementById('reviews-container').innerHTML = '<p class="no-reviews">Could not load reviews.</p>';
      });
  </script>
</body>
</html>
