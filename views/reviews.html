<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews — Fidget3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 2rem; border-bottom: 1px solid #1e1e1e; }
    nav .logo { font-size: 1.3rem; font-weight: 800; letter-spacing: 2px; text-decoration: none; color: #fff; }
    nav .logo span { color: #a78bfa; }
    nav a { color: #aaa; text-decoration: none; margin-left: 1.5rem; font-size: 0.95rem; }
    nav a:hover { color: #fff; }
    .container { max-width: 800px; margin: 4rem auto; padding: 0 2rem; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .subtitle { color: #888; margin-bottom: 2.5rem; }
    .success { background: #1a2e1a; border: 1px solid #2a4a2a; border-radius: 8px; padding: 1rem 1.2rem; margin-bottom: 1.5rem; color: #6fcf6f; }
    .form-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 2rem; margin-bottom: 3rem; }
    .form-card h2 { margin-bottom: 1.5rem; font-size: 1.2rem; }
    label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: #aaa; }
    input, textarea, select { width: 100%; padding: 0.75rem 1rem; margin-bottom: 1.2rem; background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 8px; color: #fff; font-size: 1rem; font-family: inherit; }
    textarea { height: 100px; resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #a78bfa; }
    select option { background: #1a1a1a; }
    button { width: 100%; padding: 0.8rem; background: #a78bfa; color: #000; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    button:hover { background: #c4b5fd; }
    .reviews-list h2 { font-size: 1.2rem; margin-bottom: 1.5rem; }
    .review-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
    .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
    .review-name { font-weight: 700; }
    .stars { color: #f59e0b; font-size: 1.1rem; }
    .review-text { color: #aaa; font-size: 0.9rem; line-height: 1.6; }
    .review-date { color: #555; font-size: 0.8rem; margin-top: 0.5rem; }
    .no-reviews { color: #555; text-align: center; padding: 2rem; }
    footer { text-align: center; padding: 2rem; color: #555; font-size: 0.85rem; border-top: 1px solid #1e1e1e; margin-top: 4rem; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo">Fidget<span>3D</span></a>
    <div>
      <a href="/#products">Shop</a>
      <a href="/reviews">Reviews</a>
      <a href="/contact">Contact</a>
    </div>
  </nav>
  <div class="container">
    <h1>Customer Reviews</h1>
    <p class="subtitle">See what our customers think — and leave your own review!</p>
    <div id="msg"></div>
    <div class="form-card">
      <h2>Leave a review</h2>
      <form action="/reviews" method="POST">
        <label>Your name</label>
        <input type="text" name="name" placeholder="Leo" required />
        <label>Rating</label>
        <select name="rating" required>
          <option value="">Select a rating</option>
          <option value="5">⭐⭐⭐⭐⭐ — 5 stars</option>
          <option value="4">⭐⭐⭐⭐ — 4 stars</option>
          <option value="3">⭐⭐⭐ — 3 stars</option>
          <option value="2">⭐⭐ — 2 stars</option>
          <option value="1">⭐ — 1 star</option>
        </select>
        <label>Your review</label>
        <textarea name="message" placeholder="I loved the Octopus Fidget..." required></textarea>
        <button type="submit">Submit review</button>
      </form>
    </div>
    <div class="reviews-list">
      <h2>What people are saying</h2>
      <div id="reviews-container"><p class="no-reviews">Loading reviews...</p></div>
    </div>
  </div>
  <footer>&copy; 2026 Fidget3D. All rights reserved.</footer>
  <script>
    const params = new URLSearchParams(window.location.search);
    const msg = document.getElementById('msg');
    if (params.get('submitted') === 'true') {
      msg.innerHTML = '<div class="success">⭐ Thanks for your review!</div>';
    }
    fetch('/reviews/data')
      .then(r => r.json())
      .then(reviews => {
        const container = document.getElementById('reviews-container');
        if (reviews.length === 0) {
          container.innerHTML = '<p class="no-reviews">No reviews yet — be the first!</p>';
          return;
        }
        container.innerHTML = reviews.map(r => `
          <div class="review-card">
            <div class="review-header">
              <span class="review-name">${r.name}</span>
              <span class="stars">${'⭐'.repeat(r.rating)}</span>
            </div>
            <p class="review-text">${r.message}</p>
            <p class="review-date">${new Date(r.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}</p>
          </div>
        `).join('');
      });
  </script>
</body>
</html>
